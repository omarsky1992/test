# Run from this folder:  docker compose --env-file .env up -d --build
services:
  app:
    build: ..
    restart: unless-stopped
    env_file: .env
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
    volumes:
      - storage:/var/www/html/storage/app
      # The daily dumps of the backup service, listed and downloadable from the Backups page.
      - ./backups:/backups:ro
    depends_on:
      db:
        condition: service_healthy

  # Runs the Laravel scheduler (daily Google Drive backup at 03:00).
  scheduler:
    build: ..
    restart: unless-stopped
    env_file: .env
    command: ["php", "/var/www/html/artisan", "schedule:work"]
    # The image's health check probes PHP-FPM, which this container doesn't run.
    healthcheck:
      disable: true
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      AUTORUN_ENABLED: "false"
    depends_on:
      - app

  # WhatsApp linked by QR code (WAHA). Reachable only by the app inside this private network.
  waha:
    image: devlikeapro/waha:gows-2026.9.2
    restart: unless-stopped
    environment:
      WAHA_API_KEY: ${WAHA_API_KEY}
      WHATSAPP_DEFAULT_ENGINE: GOWS
      WAHA_BASE_URL: http://waha:3000
      WAHA_DASHBOARD_ENABLED: "false"
      WHATSAPP_SWAGGER_ENABLED: "false"
      WHATSAPP_RESTART_ALL_SESSIONS: "true"
      TZ: Asia/Baghdad
    volumes:
      - waha_sessions:/app/.sessions
      - waha_media:/app/.media

  # Free speech to text for WhatsApp voice notes (Whisper, runs on this server, nothing is sent out).
  # The «small» model needs about 1 GB of memory; it is unloaded after 15 idle minutes.
  whisper:
    image: onerahmet/openai-whisper-asr-webservice:v1.10.0
    restart: unless-stopped
    environment:
      ASR_ENGINE: faster_whisper
      ASR_MODEL: ${WHISPER_MODEL:-small}
      ASR_QUANTIZATION: int8
      MODEL_IDLE_TIMEOUT: 900
    volumes:
      - whisper_models:/root/.cache

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      retries: 10

  # HTTPS certificate is obtained and renewed automatically for APP_DOMAIN.
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - app

  # Daily compressed database dumps kept in ./backups (7 days, 4 weeks, 6 months).
  backup:
    image: prodrigestivill/postgres-backup-local:17
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6
      TZ: Asia/Baghdad
    volumes:
      - ./backups:/backups
    depends_on:
      - db

volumes:
  whisper_models:
  waha_sessions:
  waha_media:
  pgdata:
  storage:
  caddy_data:
