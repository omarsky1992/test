# Render's free instance sleeps after 15 minutes without visits, and the next visit waits
# about a minute. Pinging /up every 10 minutes keeps it awake. /up doesn't touch the
# database, so the Neon database can still pause while nobody uses the system.
# Needs the APP_URL repository secret (the same one the daily backup uses).
# GitHub runs scheduled workflows only from the default branch.
name: Keep awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the app
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::error::Add the APP_URL repository secret."
            exit 1
          fi
          curl --fail --silent --show-error --retry 3 --retry-delay 20 --retry-all-errors --max-time 120 -o /dev/null "$APP_URL/up"
